targets:
  $default:
    auto_apply_builders: false
    builders:
      #! Project Generators
      gen_exporter|exporter:
        enabled: true
        options:
          folders:
            - entity
            - extensions
            - result
            - repository
            - usecase
            - utils
      gen_data|data:
        enabled: true
        generate_for:
          include:
            - "lib/src/entity/**"
