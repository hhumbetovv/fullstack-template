name: app
publish_to: none
version: 0.0.1+1
modules:
  - common_presentation
  - common_shared
  - console_presentation
  - core_data
  - core_navigation
  - core_presentation
  - demo_presentation
  - ui_components
  - ui_foundation
dev_modules: []
dependencies:
  - flutter
  - get_it
  - injectable
  - intl
  - firebase_core
