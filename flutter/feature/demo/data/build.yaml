targets:
  $default:
    auto_apply_builders: false
    builders:
      #! Package Generators
      objectbox_generator|resolver:
        enabled: true
        generate_for:
          include:
            - "lib/src/model/local/**"
      objectbox_generator|generator:
        enabled: true
      json_serializable|json_serializable:
        enabled: true
        generate_for:
          include:
            - "lib/src/model/remote/**"
      retrofit_generator|retrofit_generator:
        enabled: true
        generate_for:
          include:
            - "lib/src/datasource/remote/**"
      injectable_generator|injectable_builder:
        enabled: true
        generate_for:
          include:
            - "lib/src/module/**"
            - "lib/src/repository/**"
            - "lib/src/datasource/**"
      injectable_generator|injectable_config_builder:
        enabled: true
        generate_for:
          include:
            - "lib/init.dart"

global_options:
  json_serializable|json_serializable:
    runs_before:
      - injectable_generator|injectable_builder
  objectbox_generator|resolver:
    runs_before:
      - injectable_generator|injectable_builder
  objectbox_generator|generator:
    runs_before:
      - injectable_generator|injectable_builder
