targets:
  $default:
    auto_apply_builders: false
    builders:
      #! Project Generators
      gen_exporter|exporter:
        enabled: true
        options:
          folders:
            - repository
      #! Dependency Injection
      injectable_generator|injectable_builder:
        enabled: true
        generate_for:
          include:
            - "lib/**"
      injectable_generator|injectable_config_builder:
        enabled: true
        generate_for:
          include:
            - "lib/init.dart"

global_options:
  gen_exporter|exporter:
    runs_before:
      - injectable_generator|injectable_builder
