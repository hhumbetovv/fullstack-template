targets:
  $default:
    builders:
      #! Project Generators
      generator|data:
        enabled: false
      generator|view:
        enabled: false
      generator|provider:
        enabled: false
      generator|view_model:
        enabled: false
      generator|palette:
        enabled: false
      generator|exporter:
        enabled: true
        options:
          folders:
            - repository
            - usecase

global_options:
  generator|data:
    runs_before:
      - generator|exporter
  generator|exporter:
    runs_before:
      - injectable_generator|injectable_builder
