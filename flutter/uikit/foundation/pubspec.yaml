name: ui_foundation

environment:
  sdk: ^3.10.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  #! Generator
  build_runner: ^2.4.15

  #? Modules
  gen_exporter: any
  gen_assets: any

flutter:
  assets:
    - assets/images/

  fonts:
    - family: icon_font_generator Icons
      fonts:
        - asset: assets/fonts/icons.otf
