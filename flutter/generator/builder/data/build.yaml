targets:
  $default:
    builders:
      #! Package Generators
      source_gen|combining_builder:
        options:
          ignore_for_file:
            - "type=lint"

builders:
  data:
    import: "package:gen_data/builder.dart"
    builder_factories: ["dataBuilder"]
    build_extensions: { ".dart": [".g.dart"] }
    auto_apply: dependents
    build_to: source
