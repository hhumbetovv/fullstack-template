targets:
    $default:
        builders:
            #! Package Generators
            source_gen|combining_builder:
                options:
                    ignore_for_file:
                        - "type=lint"

builders:
    palette:
        import: "package:generator/builder.dart"
        builder_factories: [ "paletteBuilder" ]
        build_extensions: { ".dart": [ ".g.dart" ] }
        auto_apply: dependents
        build_to: source
    data:
        import: "package:generator/builder.dart"
        builder_factories: [ "dataBuilder" ]
        build_extensions: { ".dart": [ ".g.dart" ] }
        auto_apply: dependents
        build_to: source
    exporter:
        import: "package:generator/builder.dart"
        builder_factories: [ "exporterBuilder" ]
        build_extensions: { "$lib$": [ ".exports.dart" ] }
        auto_apply: dependents
        build_to: source
    view:
        import: "package:generator/builder.dart"
        builder_factories: [ "viewBuilder" ]
        build_extensions: { ".dart": [ ".g.dart" ] }
        auto_apply: dependents
        build_to: source
    provider:
        import: "package:generator/builder.dart"
        builder_factories: [ "providerBuilder" ]
        build_extensions: { ".dart": [ ".g.dart" ] }
        auto_apply: dependents
        build_to: source
    view_model:
        import: "package:generator/builder.dart"
        builder_factories: [ "viewModelBuilder" ]
        build_extensions: { ".dart": [ ".g.dart" ] }
        auto_apply: dependents
        build_to: source
